name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (format, check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/short-shepherd
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the site renders each page's revision log from git.
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/short-shepherd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build
